framework:
  id: gdpr
  name: General Data Protection Regulation
  version: "Regulation (EU) 2016/679"
  published: 2016-04-27
  effective: 2018-05-25
  source: https://eur-lex.europa.eu/eli/reg/2016/679/oj
  reviewed: 2026-06-08
  notes: |
    GDPR governs the processing of personal data of individuals in the EU
    and EEA. The UK GDPR mirrors most provisions. This harness summarizes
    the most-evaluated obligations for SaaS vendors processing personal
    data as either Controller or Processor.

categories:
  - id: PRINCIPLES
    name: Principles of Processing (Article 5)
    description: The six core principles every processing activity must satisfy.
    items:
      - id: PRINCIPLE-1
        title: Lawfulness, fairness, and transparency (Article 5(1)(a))
        evidence_type: documentation
        how_to_demonstrate: A published Privacy Policy that names every processing purpose and states the legal basis under Article 6.
      - id: PRINCIPLE-2
        title: Purpose limitation (Article 5(1)(b))
        evidence_type: documentation
        how_to_demonstrate: A processing inventory (Record of Processing Activities) showing each purpose and confirming data is not used beyond that purpose.
      - id: PRINCIPLE-3
        title: Data minimization (Article 5(1)(c))
        evidence_type: documentation
        how_to_demonstrate: A documented review confirming only data necessary for the stated purpose is collected.
      - id: PRINCIPLE-4
        title: Accuracy (Article 5(1)(d))
        evidence_type: process
        how_to_demonstrate: A user-facing process for correcting inaccurate data and a documented retention schedule.
      - id: PRINCIPLE-5
        title: Storage limitation (Article 5(1)(e))
        evidence_type: documentation
        how_to_demonstrate: A retention schedule with documented deletion or anonymization timelines per data category.
      - id: PRINCIPLE-6
        title: Integrity and confidentiality (Article 5(1)(f))
        evidence_type: technical
        how_to_demonstrate: Encryption at rest and in transit, access controls, audit logging.

  - id: LEGAL_BASES
    name: Legal Bases (Article 6)
    description: At least one legal basis must apply to every processing operation.
    items:
      - id: LB-1
        title: A legal basis is documented for every processing activity
        evidence_type: documentation
        how_to_demonstrate: The Record of Processing Activities lists the Article 6 legal basis for each activity (consent, contract, legal obligation, vital interests, public interest, legitimate interests).
      - id: LB-2
        title: Consent, where relied upon, is freely given, specific, informed, and unambiguous
        evidence_type: technical
        how_to_demonstrate: Consent capture mechanism storing the timestamp, version of the consent text, and method of capture; withdrawal must be as easy as giving consent.
      - id: LB-3
        title: Legitimate-interests assessments are documented where Article 6(1)(f) is relied upon
        evidence_type: documentation
        how_to_demonstrate: A documented Legitimate Interests Assessment for each such processing activity.

  - id: SPECIAL_CATEGORIES
    name: Special Categories of Data (Article 9)
    description: Additional safeguards for sensitive data.
    items:
      - id: SC-1
        title: Special categories of data are identified and an Article 9(2) condition is documented
        evidence_type: documentation
        how_to_demonstrate: Where racial, ethnic, religious, political, health, sexual orientation, genetic, biometric, or trade-union data is processed, the Article 9(2) condition (typically explicit consent) is recorded.

  - id: DATA_SUBJECT_RIGHTS
    name: Data Subject Rights (Articles 12 to 22)
    description: Rights that data subjects can exercise.
    items:
      - id: DSR-1
        title: Right of access (Article 15)
        evidence_type: process
        how_to_demonstrate: A documented Data Subject Access Request workflow with a 30-day response SLA.
      - id: DSR-2
        title: Right to rectification (Article 16)
        evidence_type: technical
        how_to_demonstrate: A user-facing way to correct personal data.
      - id: DSR-3
        title: Right to erasure (Article 17)
        evidence_type: technical
        how_to_demonstrate: An account-deletion flow that removes personal data subject to documented retention exceptions.
      - id: DSR-4
        title: Right to data portability (Article 20)
        evidence_type: technical
        how_to_demonstrate: Export of personal data in a structured, commonly used, machine-readable format (JSON or CSV).
      - id: DSR-5
        title: Right to object to automated decision-making (Article 22)
        evidence_type: documentation
        how_to_demonstrate: A documented mechanism to opt out of solely automated decisions with legal or similarly significant effect, where applicable.

  - id: ACCOUNTABILITY
    name: Accountability and Governance (Articles 24 to 39)
    description: Documentation and operational obligations.
    items:
      - id: ACC-1
        title: Record of Processing Activities is maintained (Article 30)
        evidence_type: documentation
        how_to_demonstrate: A Record of Processing Activities listing purposes, categories, recipients, transfers, retention, and security measures.
      - id: ACC-2
        title: Data Processing Addendum is in place with each Processor (Article 28)
        evidence_type: documentation
        how_to_demonstrate: Signed DPAs with every Processor (Google Workspace, AWS, Stripe, etc.) reflecting Article 28 obligations.
      - id: ACC-3
        title: Sub-processors are managed and disclosed (Article 28(2))
        evidence_type: documentation
        how_to_demonstrate: A published sub-processor list with change-notification process and an objection window.
      - id: ACC-4
        title: Data Protection Officer is appointed where required (Article 37)
        evidence_type: documentation
        how_to_demonstrate: A DPO appointment record where required by Article 37, or a documented analysis confirming Article 37 does not apply.
      - id: ACC-5
        title: Data Protection Impact Assessments are conducted for high-risk processing (Article 35)
        evidence_type: documentation
        how_to_demonstrate: A DPIA for any new high-risk processing, with the assessment refreshed when the processing changes materially.

  - id: SECURITY_AND_BREACH
    name: Security and Breach Notification (Articles 32 to 34)
    description: Security measures and breach-reporting obligations.
    items:
      - id: SEC-1
        title: Appropriate technical and organizational measures are in place (Article 32)
        evidence_type: technical
        how_to_demonstrate: A Security Architecture Overview describing encryption, access control, logging, and personnel measures.
      - id: SEC-2
        title: Personal data breaches are notified to the supervisory authority within 72 hours (Article 33)
        evidence_type: process
        how_to_demonstrate: An Incident Response Plan that names the 72-hour notification timeline and the responsible reporter.
      - id: SEC-3
        title: Affected individuals are notified without undue delay where breach poses high risk (Article 34)
        evidence_type: process
        how_to_demonstrate: An IR Plan that specifies the criteria for notifying individuals and the channels used.

  - id: TRANSFERS
    name: International Transfers (Chapter V)
    description: Mechanisms for transfers outside the EEA, UK, or Switzerland.
    items:
      - id: XFER-1
        title: Standard Contractual Clauses (Module 2 and Module 3) are in place where required (Article 46)
        evidence_type: documentation
        how_to_demonstrate: Signed SCCs (Implementing Decision (EU) 2021/914) attached to every DPA where data leaves the EEA without an adequacy decision.
      - id: XFER-2
        title: Supplementary measures are documented where required by Schrems II
        evidence_type: documentation
        how_to_demonstrate: Documented Transfer Impact Assessment for transfers to the United States or other third countries without adequacy.
